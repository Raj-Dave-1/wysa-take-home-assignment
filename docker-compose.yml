services:
  postgres:
    image: postgres:16-alpine
    container_name: wysa_postgres
    environment:
      POSTGRES_USER: wysa
      POSTGRES_PASSWORD: wysa
      POSTGRES_DB: wysa
    ports:
      - "5433:5432"
    volumes:
      - wysa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wysa -d wysa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wysa_redis
    ports:
      - "6379:6379"
    volumes:
      - wysa_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wysa_pg_data:
  wysa_redis_data:
